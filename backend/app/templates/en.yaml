welcome_help: |
  Good day! I am your *Along Abuja Corridor Coordinator*.
  Just tell me where you are standing and where you are heading in English, Pidgin, or Hausa (text or voice note), and I will match you to a safe filling-station pod right away.

ask_origin: |
  I see where you are heading! Which Abuja junction or landmark are you standing at right now so I can direct you to the nearest safe filling-station bay? (e.g., *Dutse First Gate*, *Sokale Roundabout*, *Lugbe Police Signboard*, or *Orange Market Mararaba*)

ask_destination: |
  Got you at *{origin_name}*! Where along the corridor are you dropping off today? (e.g., *Berger Underbridge*, *Oando Katampe*, *Wuse Market*, *Area 1*, or *Federal Secretariat*)

ask_both_slots: |
  Tell me your current junction and where you are heading in Abuja, and I will check the next 4-seat pod for you. For example: *"From Sokale Roundabout, drop me at that Oando after Katampe bridge"*

disambiguate_origin: |
  I found a few spots matching your pickup. Which one are you closest to right now?
  {options_text}
  Reply with `1`, `2`, or `3` (or type the name).

disambiguate_destination: |
  Which of these drop-off points along the corridor did you mean?
  {options_text}
  Reply with `1`, `2`, or `3` (or type the name).

short_trip_rejected: |
  *{origin_name}* and *{dest_name}* are right next to each other (under 800m). Our Along pods run corridor trips of 800m and above. Which further junction down the road are you heading to?

quote_ready: |
  I have a 4-seat pod loading right now inside *{anchor_name}* (just a short walk from *{origin_name}*, safe forecourt with zero roadside touts). Dropping you at *{dest_name}* is *{unit_fare_naira}* per seat (*{total_fare_naira}* total for *{seats}* seat(s), saving you {savings_pct}% vs a solo ride). Shall I lock your seat in escrow?
  *Along Corridor Quote ({corridor_id})*

pooling_started: |
  Awesome, your seat is locked in! Walk into the safe forecourt at *{anchor_name}* and show Boarding Code *{boarding_otp}* to your driver before takeoff. Your *{total_fare_naira}* fare is held safely in escrow until your code is verified ({current_seats}/4 seats filled, Request `{request_code}`).

pod_matched: |
  *Pod `{pod_code}` Matched!*
  Driver: *{driver_name}* ({vehicle_desc}, Plate *{plate_number}*)
  Meet at Safe Anchor: *{anchor_name}* (Private Filling Station Bay, Zero Agbero Touts)
  Boarding Code (OTP): *{boarding_otp}*
  Live Trip Tracker: {share_url}

status_update: |
  *Along Booking Status*
  State: `{stage}`
  Route: *{origin_name}* -> *{dest_name}*
  Anchor: *{anchor_name}*

booking_cancelled: |
  Your Along booking has been cancelled and any held escrow has been refunded to your wallet. Send a new pickup and destination whenever you are ready.

sos_triggered: |
  *EMERGENCY SOS ACTIVATED*
  Along Safety Command Center has been alerted with your live corridor telemetry and pod details. An operations dispatcher is contacting you and security responders immediately.

rating_recorded: |
  Thank you for rating your Along trip *{stars}/5 stars*! Safe travels across Abuja.

blocked_message: |
  We could not process that message. Please send a valid Abuja pickup and destination landmark.
