welcome_help: |
  How far boss! Na your *Along Abuja Corridor Coordinator* be this.
  Just yarn me where you dey stand and where you dey go for Pidgin, Hausa, or English (text or voice note), make I put you inside safe filling-station pod sharp-sharp.

ask_origin: |
  I hear where you wan drop! Abeg which junction you dey stand right now make our pod pick you inside safe filling station? (like *Dutse First Gate*, *Sokale Roundabout*, *Police Signboard Lugbe*, or *Orange Market Mararaba*)

ask_destination: |
  Correct, I see say you dey *{origin_name}*! Abeg which junction you dey drop down the road? (like *Berger Underbridge*, *Oando Katampe*, *Wuse Market*, *Area 1*, or *Federal Secretariat*)

ask_both_slots: |
  No wahala! Just tell me the junction wey you dey now and where you dey go for Abuja, make I check clean 4-seat pod for you. Like: *"Abeg I dey Dutse First Gate, two seats go Berger"*

disambiguate_origin: |
  Abeg which of these junctions you dey close to pass right now?
  {options_text}
  Reply `1`, `2`, or `3` (or type the name).

disambiguate_destination: |
  Which of these drop-off spots down the corridor you mean so?
  {options_text}
  Reply `1`, `2`, or `3` (or type the name).

short_trip_rejected: |
  Oga mi, *{origin_name}* and *{dest_name}* too near each other (under 800m). Along pod na for proper corridor movement pass 800m. Which further junction down the road you wan reach?

quote_ready: |
  Sharp boss! Our clean 4-seat pod dey load right now inside *{anchor_name}* (safe filling station, zero agbero wahala) heading straight go *{dest_name}* ({savings_pct}% cheaper pass solo drop). Check your fare card below make I lock your seat sharp-sharp!
  *Along Corridor Quote ({corridor_id})*

pooling_started: |
  Twale! Your seat don lock inside escrow ({current_seats}/4 seats ready). Just waka enter *{anchor_name}* forecourt now and show Driver Musa your 4-digit Boarding Code *{boarding_otp}* on the pass below before moto move.

pod_matched: |
  *Pod `{pod_code}` Don Set!*
  Driver: *{driver_name}* ({vehicle_desc}, Plate *{plate_number}*)
  Wait for Safe Anchor: *{anchor_name}* (Inside Filling Station, No Agbero Wahala)
  Your Boarding Code (OTP): *{boarding_otp}*
  Follow Live Movement: {share_url}

status_update: |
  *Along Ride Status*
  Stage: `{stage}`
  Route: *{origin_name}* -> *{dest_name}*
  Anchor: *{anchor_name}*

booking_cancelled: |
  We don cancel your Along booking and return your money sharp-sharp to your wallet. Message us anytime you wan move again.

sos_triggered: |
  *SOS EMERGENCY ALERT DON FIRE*
  Along Safety Command Center don get your live location and moto details now-now. Our safety team dey call you and security patrol immediately.

rating_recorded: |
  Twale! Thanks for giving your Along trip *{stars}/5 stars*! Safe waka around Abuja.

blocked_message: |
  We no fit process that message. Abeg send your Abuja pickup and destination junction.
