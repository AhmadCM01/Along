[build-system]
requires = ["setuptools>=68.0", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "along-backend"
version = "1.0.0"
description = "Along: AI-orchestrated shared corridor transit backend for Abuja, Nigeria"
requires-python = ">=3.11"
dependencies = [
    "fastapi>=0.115.0",
    "uvicorn[standard]>=0.30.0",
    "pydantic>=2.9.0",
    "pydantic-settings>=2.5.0",
    "asyncpg>=0.29.0",
    "redis>=5.1.0",
    "httpx>=0.27.0",
    "structlog>=24.4.0",
    "PyYAML>=6.0.2",
    "PyJWT>=2.9.0",
    "numpy>=1.26.0",
    "rapidfuzz>=3.9.0",
]

[project.optional-dependencies]
ai = [
    "faiss-cpu>=1.8.0",
    "fastembed>=0.3.6",
    "langgraph>=0.2.35",
]
dev = [
    "pytest>=8.3.0",
    "pytest-asyncio>=0.24.0",
    "fakeredis[lua]>=2.25.0",
    "lupa>=2.2",
    "ruff>=0.6.0",
    "mypy>=1.11.0",
]

[tool.setuptools.packages.find]
where = ["."]
include = ["app*", "scripts*"]

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]
pythonpath = ["."]
addopts = "--capture=sys"

[tool.ruff]
line-length = 100
target-version = "py312"

[tool.mypy]
python_version = "3.12"
strict = true
ignore_missing_imports = true
