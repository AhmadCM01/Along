services:
  postgres:
    image: postgis/postgis:16-3.4
    environment:
      POSTGRES_USER: along
      POSTGRES_PASSWORD: along_dev_password
      POSTGRES_DB: along
    ports:
      - "5432:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U along -d along"]
      interval: 5s
      timeout: 3s
      retries: 10

  redis:
    image: redis:8.0-alpine
    command: ["redis-server", "--appendonly", "yes", "--appendfsync", "everysec"]
    ports:
      - "6379:6379"
    volumes:
      - redisdata:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 10

  api:
    build:
      context: ./backend
      dockerfile: Dockerfile
    command: ["uvicorn", "app.main:app", "--host", "0.0.0.0", "--port", "8000", "--workers", "2"]
    env_file:
      - .env.example
    ports:
      - "8000:8000"
    volumes:
      - ./data:/app/data
      - ./supabase:/app/supabase
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy

  worker:
    build:
      context: ./backend
      dockerfile: Dockerfile
    command: ["python", "-m", "app.workers.main"]
    env_file:
      - .env.example
    volumes:
      - ./data:/app/data
    depends_on:
      api:
        condition: service_started

  scheduler:
    build:
      context: ./backend
      dockerfile: Dockerfile
    command: ["python", "-m", "app.scheduler.main"]
    env_file:
      - .env.example
    depends_on:
      api:
        condition: service_started

  web:
    build:
      context: ./web
      dockerfile: Dockerfile
    env_file:
      - .env.example
    ports:
      - "3000:3000"
    depends_on:
      api:
        condition: service_started

  caddy:
    image: caddy:2-alpine
    ports:
      - "80:80"
      - "443:443"
    volumes:
      - ./Caddyfile:/etc/caddy/Caddyfile
      - caddy_data:/data
    depends_on:
      - api
      - web

volumes:
  pgdata:
  redisdata:
  caddy_data:
